<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 20px #0001;
        }

        h2 {
            text-align: center;
            color: #263b68;
        }

        p {
            text-align: center;
            color: #777;
        }

        input, button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border-radius: 8px;
            font-size: 15px;
        }

        input {
            border: 1px solid #ddd;
            outline: none;
        }

        input:focus {
            border-color: #14532D;
            box-shadow: 0 0 0 2px #14532D20;
        }

        /* DARK GREEN LOGIN BUTTON */
        button {
            background-color: #14532D;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0B3D20;
        }

        button:active {
            background-color: #082F18;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        a {
            color: #14532D;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        #message {
            font-size: 14px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Welcome Back!</h2>
    <p>Login to manage your expenses.</p>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            autocomplete="email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password"
            required
        >

        <button type="submit" id="loginButton">
            Login
        </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p>
        Don't have an account?
        <a href="signup.html">Sign Up</a>
    </p>

</div>

<script>
document.getElementById("loginForm").addEventListener(
    "submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("loginButton");

        message.textContent = "Checking your account...";
        message.style.color = "#555";

        button.disabled = true;

        try {
            const response = await fetch(
                "http://localhost:8080/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },

                    body: new URLSearchParams({
                        email: email,
                        password: password
                    }).toString()
                }
            );

            const result = await response.json();

            if (response.ok && result.userId && result.token) {

                // Store login information for this browser tab.
                sessionStorage.setItem(
                    "userId",
                    result.userId
                );

                sessionStorage.setItem(
                    "userName",
                    result.name
                );

                // Store the session token returned by Java.
                sessionStorage.setItem(
                    "authToken",
                    result.token
                );

                message.textContent = "Login successful!";
                message.style.color = "#14532D";

                setTimeout(function() {
                    window.location.href = "dashboard.html";
                }, 700);

            } else {
                message.textContent =
                    result.message || "Login failed.";

                message.style.color = "#b91c1c";
            }

        } catch (error) {
            message.textContent =
                "Cannot connect to the server. Please check whether the Java server is running.";

            message.style.color = "#b91c1c";

        } finally {
            button.disabled = false;
        }
    }
);
</script>

</body>
</html>
