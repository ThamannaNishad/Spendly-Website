<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spendly - Profile</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 20px 100px;
            font-family: Arial, sans-serif;
            background: #f9f9f7;
            color: #1a1c1b;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        h1, h2 {
            color: #163428;
        }

        header a {
            color: #245b46;
            text-decoration: none;
        }

        .profile-card {
            background: white;
            padding: 25px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 2px 8px #0000000d;
            margin-bottom: 20px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #163428;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 15px;
        }

        .profile-card h2 {
            margin-bottom: 5px;
        }

        .profile-card p {
            color: #777;
        }

        .details-card {
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 2px 8px #0000000d;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #666;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
        }

        input:disabled {
            background: #f5f5f2;
            color: #555;
        }

        button {
            border: none;
            background: #163428;
            color: white;
            padding: 13px 20px;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .secondary {
            background: #e8eee9;
            color: #163428;
        }

        .message {
            color: #245b46;
            margin-top: 15px;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: white;
            box-shadow: 0 -2px 10px #00000012;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 4px;
        }

        nav a {
            color: #245b46;
            text-decoration: none;
            font-size: 12px;
            text-align: center;
            padding: 8px 4px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Spendly</h1>
        <a href="dashboard.html">← Dashboard</a>
    </header>

    <section class="profile-card">
        <div class="avatar" id="avatar">U</div>

        <h2 id="displayName">Your Name</h2>

        <p>Spendly Member</p>
    </section>

    <section class="details-card">

        <h2>My Profile</h2>

        <form id="profileForm">

            <div class="field">
                <label for="name">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your name" required>
            </div>

            <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email">
            </div>

            <div class="field">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                       placeholder="Enter your phone number">
            </div>

            <div class="buttons">
                <button type="button" id="editButton"
                        onclick="enableEditing()">
                    Edit Profile
                </button>

                <button type="submit" id="saveButton"
                        style="display:none">
                    Save Changes
                </button>

                <button type="button" class="secondary"
                        onclick="location.href='dashboard.html'">
                    Back to Dashboard
                </button>
            </div>

            <p class="message" id="message"></p>

        </form>

    </section>

    <nav>
        <a href="dashboard.html">⌂<br>Home</a>
        <a href="transaction_history.html">▤<br>History</a>
        <a href="analytics.html">▥<br>Insights</a>
        <a href="budgets.html">◉<br>Budgets</a>
    </nav>

    <script>
        const fields = [
            document.getElementById('name'),
            document.getElementById('email'),
            document.getElementById('phone')
        ];

        function loadProfile() {
            document.getElementById('name').value =
                localStorage.getItem('profileName') || '';

            document.getElementById('email').value =
                localStorage.getItem('profileEmail') || '';

            document.getElementById('phone').value =
                localStorage.getItem('profilePhone') || '';

            updateDisplay();

            fields.forEach(field => field.disabled = true);
        }

        function updateDisplay() {
            const name =
                document.getElementById('name').value.trim();

            document.getElementById('displayName').textContent =
                name || 'Your Name';

            document.getElementById('avatar').textContent =
                name ? name.charAt(0).toUpperCase() : 'U';
        }

        function enableEditing() {
            fields.forEach(field => field.disabled = false);

            document.getElementById('editButton').style.display = 'none';
            document.getElementById('saveButton').style.display = 'inline-block';

            document.getElementById('name').focus();
        }

        document.getElementById('profileForm')
            .addEventListener('submit', function(event) {
                event.preventDefault();

                const name =
                    document.getElementById('name').value.trim();

                if (!name) {
                    alert('Please enter your name.');
                    return;
                }

                localStorage.setItem('profileName', name);
                localStorage.setItem(
                    'profileEmail',
                    document.getElementById('email').value.trim()
                );
                localStorage.setItem(
                    'profilePhone',
                    document.getElementById('phone').value.trim()
                );

                updateDisplay();

                fields.forEach(field => field.disabled = true);

                document.getElementById('editButton').style.display =
                    'inline-block';

                document.getElementById('saveButton').style.display =
                    'none';

                document.getElementById('message').textContent =
                    'Profile saved successfully!';

            });

        loadProfile();
    </script>

</body>
</html>
