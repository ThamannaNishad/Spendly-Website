<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 5px 20px #0001;
        }

        h2 {
            text-align: center;
            color: #263b68;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #777;
        }

        input, button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border-radius: 8px;
            font-size: 15px;
        }

        input {
            border: 1px solid #ddd;
            outline: none;
        }

        input:focus {
            border-color: #22a447;
            box-shadow: 0 0 4px #22a44750;
        }

        button {
            background: #22a447;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #188638;
        }

        button:disabled {
            background: #8bc99b;
            cursor: not-allowed;
        }

        #message {
            font-size: 14px;
            text-align: center;
            overflow-wrap: anywhere;
        }

        a {
            color: #4c65d9;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Create Account</h2>
    <p>Start managing your money smarter.</p>

    <form id="signupForm">

        <input
            type="text"
            id="name"
            placeholder="Full Name"
            autocomplete="name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            autocomplete="email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password (minimum 8 characters)"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
            minlength="8"
            autocomplete="new-password"
            required
        >

        <button type="submit" id="submitButton">
            Create Account
        </button>

    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>

<script>
document.getElementById("signupForm").addEventListener(
    "submit", async function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message = document.getElementById("message");
        const button = document.getElementById("submitButton");

        if (password !== confirmPassword) {
            message.textContent = "Passwords do not match!";
            message.style.color = "red";
            return;
        }

        if (password.length < 8) {
            message.textContent =
                "Password must contain at least 8 characters.";
            message.style.color = "red";
            return;
        }

        message.textContent = "Creating your account...";
        message.style.color = "#555";
        button.disabled = true;
        button.textContent = "Please wait...";

        try {
            const response = await fetch(
                "http://localhost:8080/signup",
                {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    body: new URLSearchParams({
                        name: name,
                        email: email,
                        password: password
                    }).toString()
                }
            );

            const result = await response.json();

            message.textContent = result.message ||
                result.error || "Request completed.";

            message.style.color = response.ok ? "green" : "red";

            if (response.ok) {
                document.getElementById("signupForm").reset();
            }

        } catch (error) {
            message.textContent =
                "Server connection failed. Please check the Java server.";
            message.style.color = "red";

        } finally {
            button.disabled = false;
            button.textContent = "Create Account";
        }
    }
);
</script>

</body>
</html>
